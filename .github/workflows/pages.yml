# Publishes the site to GitHub Pages on every push to main (or when started by hand in the Actions tab).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Only the files the browser needs; the local servers, tools and docs stay out of the site.
      # Pages shows 404.html for unknown addresses. The not-found page uses root paths ("/styles/…"),
      # so they get the site's base path ("/coursework_frontend") in front.
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html assets components pages scripts styles _site/
          sed -E 's#(href|src)="/#\1="${{ steps.pages.outputs.base_path }}/#g' pages/NotFound/NotFound.html > _site/404.html

      - uses: actions/upload-pages-artifact@v5

      - id: deployment
        uses: actions/deploy-pages@v5
