<template id="error-state">
  <div class="error-state" role="alert">
    <svg class="error-state__icon" data-icon="circle-alert"></svg>
    <p class="error-state__text" data-ref="text"></p>
    <button class="btn btn--secondary btn--sm" type="button" data-ref="retry">
      <svg data-icon="refresh-cw"></svg>
      <span data-i18n="common.tryAgain"></span>
    </button>
  </div>
</template>
