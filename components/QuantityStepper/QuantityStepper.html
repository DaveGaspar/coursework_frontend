<template id="quantity">
  <div class="qty" role="group">
    <button class="btn btn--icon btn--secondary" type="button" data-ref="minus" data-i18n-attr="aria-label:checkout.qtyLess">
      <svg data-icon="minus"></svg>
    </button>
    <output class="qty__value" data-ref="value" aria-live="polite"></output>
    <button class="btn btn--icon btn--secondary" type="button" data-ref="plus" data-i18n-attr="aria-label:checkout.qtyMore">
      <svg data-icon="plus"></svg>
    </button>
  </div>
</template>
