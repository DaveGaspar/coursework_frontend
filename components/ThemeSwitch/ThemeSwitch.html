<template id="theme-switch">
  <div class="theme-switch" role="group" data-i18n-attr="aria-label:theme.label">
    <button class="theme-switch__option" type="button" data-theme-option="system" aria-pressed="false">
      <svg class="icon--sm" data-icon="monitor"></svg>
      <span data-i18n="theme.system"></span>
    </button>
    <button class="theme-switch__option" type="button" data-theme-option="light" aria-pressed="false">
      <svg class="icon--sm" data-icon="sun"></svg>
      <span data-i18n="theme.light"></span>
    </button>
    <button class="theme-switch__option" type="button" data-theme-option="dark" aria-pressed="false">
      <svg class="icon--sm" data-icon="moon"></svg>
      <span data-i18n="theme.dark"></span>
    </button>
  </div>
</template>
