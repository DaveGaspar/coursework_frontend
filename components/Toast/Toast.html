<template id="toast">
  <div class="toast">
    <svg class="toast__icon" data-ref="icon" data-icon="info"></svg>
    <div class="toast__body">
      <p class="toast__title" data-ref="title" hidden></p>
      <p data-ref="message"></p>
    </div>
    <button class="btn btn--icon btn--sm toast__close" type="button" data-ref="close" data-i18n-attr="aria-label:a11y.dismiss">
      <svg data-icon="x"></svg>
    </button>
  </div>
</template>
