<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Live</title>
  <meta name="description" content="">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sports Live">
  <meta property="og:title" content="Sports Live">
  <meta property="og:description" content="">
  <meta property="og:image" content="../../assets/img/og-image.png">
  <meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12110E" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
  <link rel="manifest" href="../../assets/manifest.webmanifest">
  <link rel="preload" href="../../assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../../styles/index.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="Admin.css">
  <script src="../../assets/vendor/chart.umd.min.js" defer></script>
  <script src="../../scripts/core/theme-boot.js"></script>
  <script type="module" src="Reports.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skipToContent"></a>
  <header id="site-header" class="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="container stack stack--lg">
      <div class="admin-head">
        <p class="d-lg" data-i18n="nav.admin"></p>
        <nav class="tabs" data-i18n-attr="aria-label:admin.sections">
          <a class="tabs__item" data-route="adminTeams"><svg data-icon="users"></svg><span data-i18n="admin.tabs.teams"></span></a>
          <a class="tabs__item" data-route="adminMatches"><svg data-icon="calendar"></svg><span data-i18n="admin.tabs.matches"></span></a>
          <a class="tabs__item" data-route="adminReports" aria-current="page"><svg data-icon="chart-column"></svg><span data-i18n="admin.tabs.reports"></span></a>
        </nav>
      </div>
      <hr class="divider">
      <div class="admin-section-head">
        <h1 class="h1" data-i18n="admin.reports.title"></h1>
      </div>
      <div class="stat-grid" id="kpis" aria-busy="true">
        <span class="skeleton skeleton--tile" aria-hidden="true"></span>
        <span class="skeleton skeleton--tile" aria-hidden="true"></span>
        <span class="skeleton skeleton--tile" aria-hidden="true"></span>
        <span class="skeleton skeleton--tile" aria-hidden="true"></span>
      </div>
      <div class="report-grid" id="report-body" hidden>
        <section class="card report-grid__full stack" aria-labelledby="details-title">
          <div class="admin-section-head">
            <h2 class="h2" id="details-title" data-i18n="admin.reports.details"></h2>
            <div class="field">
              <label class="visually-hidden" for="match-select" data-i18n="admin.reports.chooseMatch"></label>
              <div class="field__control">
                <select class="select" id="match-select"></select>
                <svg class="field__chevron" data-icon="chevron-down"></svg>
              </div>
            </div>
          </div>
          <div class="match-details">
            <div class="mini-tiles" id="mini-tiles"></div>
            <div class="stack stack--sm">
              <h3 class="h3" data-i18n="admin.reports.statistics"></h3>
              <ul class="stat-list" id="stat-list" role="list"></ul>
            </div>
          </div>
        </section>
        <section class="card chart-card" id="attendance-card" aria-labelledby="attendance-title"></section>
        <section class="card chart-card" id="revenue-card" aria-labelledby="revenue-title"></section>
        <section class="card chart-card" id="donut-card" aria-labelledby="donut-title"></section>
        <section class="card chart-card" aria-labelledby="breakdown-title">
          <h2 class="chart-card__title" id="breakdown-title" data-i18n="admin.reports.breakdown"></h2>
          <div class="table-scroll" id="breakdown"></div>
        </section>
      </div>
      <div id="report-empty" hidden></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer on-night"></footer>
</body>
</html>
